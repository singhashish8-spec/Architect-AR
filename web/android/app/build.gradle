apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = "com.singhashish.architectar"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.singhashish.architectar"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // ARCore/SceneView (Filament) and the native AR plugin are Kotlin --
    // Capacitor's own generated MainActivity.java stays Java, both
    // languages coexist fine in one module.
    kotlinOptions {
        jvmTarget = "21"
    }
    // Only the new AR Activity uses Compose (SceneView 4.x's ARScene is
    // a Composable) -- Capacitor's own MainActivity/WebView UI is
    // untouched, still plain Android views.
    buildFeatures {
        compose true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Native AR walkthrough (Phase 4, docs/features/ar-walkthrough.md).
    // SceneView wraps ARCore + Filament (Google's real-time PBR renderer,
    // the same rendering technology <model-viewer> uses on the web side)
    // with a much smaller API surface than driving ARCore's session and a
    // raw OpenGL renderer by hand -- and it loads GLB/glTF directly, the
    // exact format every model in this app is already converted to
    // client-side (ifc/ifcToGlb.ts, viewer/fbxToGlb.ts), so no new
    // conversion step is needed for the native side either.
    // Pinned to 2.2.1, not the current 4.x line -- 4.x rewrote ARScene
    // around a fully declarative Compose scene-graph (no childNodes list,
    // AnchorNode moved packages, no rememberNodes()) that would need a
    // rewrite of this screen to match; 2.2.1 is the last release with the
    // imperative childNodes/onSessionUpdated API this code is written
    // against, confirmed against its real source on GitHub (tag v2.2.1).
    implementation "io.github.sceneview:arsceneview:2.2.1"
    implementation "com.google.ar:core:1.54.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.1"

    // Compose, for the AR Activity's UI only (status overlay, permission
    // prompts) -- ARScene itself is a Composable in SceneView 4.x.
    implementation platform('androidx.compose:compose-bom:2026.02.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.11.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
